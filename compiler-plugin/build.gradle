plugins {
    id 'java'
    id 'checkstyle'
    id 'com.github.spotbugs'
}

description = 'Ballerina - WSO2 ICP Runtime Bridge Compiler Plugin'

// The Ballerina compiler API jars (ballerina-lang, ballerina-tools-api, ballerina-parser,
// ballerina-runtime) and ballerina-to-openapi are not published on public Maven repositories
// with reliable, unauthenticated access, so they are sourced directly from a local Ballerina
// distribution instead. Override with -PballerinaHome=/path/to/distribution if needed.
def ballerinaHome = project.hasProperty('ballerinaHome')
        ? project.property('ballerinaHome')
        : ['bal', 'home'].execute().text.trim()

def compilerApiJars = fileTree("${ballerinaHome}/bre/lib").matching {
    include 'ballerina-lang-*.jar'
    include 'ballerina-tools-api-*.jar'
    include 'ballerina-parser-*.jar'
    include 'ballerina-rt-*.jar'
}

// The distribution's bala repo ships exactly one http version, and which one depends on the
// distribution (2201.13.2 → 2.15.4, 2201.13.4 → 2.16.3, 2201.14.0 → 2.18.0). Pinning that version in a property
// broke whichever environment ran the other distribution — local or CI — so the lookup takes
// whatever version the distribution in use actually shipped.
def openapiMapperJar = fileTree("${ballerinaHome}/repo/bala/ballerina/http").matching {
    include '*/java25/compiler-plugin/**/ballerina-to-openapi-*.jar'
}

dependencies {
    checkstyle project(':checkstyle')
    checkstyle "com.puppycrawl.tools:checkstyle:${puppycrawlCheckstyleVersion}"

    compileOnly files(compilerApiJars)
    implementation files(openapiMapperJar)
    implementation(group: 'io.swagger.core.v3', name: 'swagger-core-jakarta', version: "${swaggerCoreVersion}") {
        // Pair with the plain (non-jakarta) OpenAPI model classes, matching the variant
        // ballerina-to-openapi itself was compiled against.
        exclude group: 'io.swagger.core.v3', module: 'swagger-models-jakarta'
    }
    implementation group: 'io.swagger.core.v3', name: 'swagger-models', version: "${swaggerCoreVersion}"

    // swagger-core (above) pulls in slf4j-api transitively with no binding, which prints
    // "Failed to load class StaticLoggerBinder" on every bal build/run of a package that
    // imports this plugin. A no-op binding silences it without behavior changes.
    implementation group: 'org.slf4j', name: 'slf4j-nop', version: "${slf4jVersion}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

def excludePattern = '**/module-info.java'
tasks.withType(Checkstyle).configureEach {
    exclude excludePattern
}

checkstyle {
    toolVersion "${puppycrawlCheckstyleVersion}"
    configFile rootProject.file("build-config/checkstyle/build/checkstyle.xml")
    configProperties = ["suppressionFile" : file("${rootDir}/build-config/checkstyle/build/suppressions.xml")]
}

checkstyleMain.dependsOn(":checkstyle:downloadCheckstyleRuleFiles")

spotbugsMain {
    def classLoader = plugins["com.github.spotbugs"].class.classLoader
    def SpotBugsConfidence = classLoader.loadClass("com.github.spotbugs.snom.Confidence")
    def SpotBugsEffort = classLoader.loadClass("com.github.spotbugs.snom.Effort")
    effort = SpotBugsEffort.MAX
    reportLevel = SpotBugsConfidence.LOW
    reportsDir = file("$project.buildDir/reports/spotbugs")
    reports {
        html.enabled true
        text.enabled = true
    }
    def excludeFile = file("${rootDir}/spotbugs-exclude.xml")
    if (excludeFile.exists()) {
        excludeFilter = excludeFile
    }
}

spotbugsTest {
    enabled = false
}

def icpLibDir = file("${rootDir}/ballerina/lib")
def compilerPluginTomlPlaceHolder = file("${rootDir}/build-config/resources/CompilerPlugin.toml")
def compilerPluginTomlFile = file("${rootDir}/ballerina/CompilerPlugin.toml")

// Sync rather than Copy: a jar left over from an earlier build (e.g. the previous distribution's
// ballerina-to-openapi) would otherwise satisfy a stale CompilerPlugin.toml entry locally while
// failing on a clean checkout.
tasks.register('copyBundledLibs', Sync) {
    dependsOn jar
    from jar.archiveFile
    from configurations.runtimeClasspath
    into icpLibDir
}

// The [[dependency]] entries are generated from exactly the jars copyBundledLibs ships, so the
// version-specific names (this plugin's own version, and the ballerina-to-openapi version that
// depends on the Ballerina distribution in use) never have to be kept in sync by hand.
tasks.register('updateCompilerPluginToml') {
    dependsOn jar
    def pluginJarName = jar.archiveFileName
    def runtimeJars = configurations.runtimeClasspath
    inputs.file(compilerPluginTomlPlaceHolder)
    inputs.files(runtimeJars)
    inputs.property('pluginJarName', pluginJarName)
    outputs.file(compilerPluginTomlFile)
    doLast {
        def jarNames = [pluginJarName.get()] + runtimeJars.files.collect { it.name }
        def dependencies = jarNames.collect { "[[dependency]]\npath = \"lib/${it}\"\n" }.join('\n')
        compilerPluginTomlFile.text = "${compilerPluginTomlPlaceHolder.text.trim()}\n\n${dependencies}"
    }
}

build.dependsOn copyBundledLibs
build.dependsOn updateCompilerPluginToml
